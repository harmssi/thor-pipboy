plugins { id 'com.android.application' }

android {
    namespace 'de.harmssi.thorpipboy'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'de.harmssi.thorpipboy'
        minSdk 33
        targetSdk 33
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    signingConfigs {
        thor {
            // fester Schlüssel aus dem Build-Container (docker-build.sh), damit Updates drüber installieren
            storeFile file(System.getenv('THOR_KEYSTORE') ?: "${rootDir}/keystore/thorpipboy.jks")
            storePassword 'thorpipboy'; keyAlias 'thorpipboy'; keyPassword 'thorpipboy'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.thor }
    }
}
